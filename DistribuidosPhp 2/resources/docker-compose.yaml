version: '3'

services:
  mysql:
    image: mysql:8.0
    container_name: song_vault_mysql
    environment:
      MYSQL_DATABASE: song_vault
      MYSQL_USER: song_user
      MYSQL_PASSWORD: song_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: song_vault_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: song_user
      PMA_PASSWORD: song_pass
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
